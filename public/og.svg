<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0f"/>

  <!-- Glow -->
  <ellipse cx="600" cy="315" rx="500" ry="300" fill="url(#glow)"/>

  <!-- Grid lines (subtle) -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#2a2a3a" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#2a2a3a" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#2a2a3a" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#2a2a3a" stroke-width="1"/>

  <!-- Border -->
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="none" stroke="#2a2a3a" stroke-width="1.5"/>

  <!-- Logo mark -->
  <rect x="80" y="80" width="56" height="56" rx="12" fill="#00ff88"/>
  <text x="108" y="118" font-family="monospace" font-size="22" font-weight="700" fill="#0a0a0f" text-anchor="middle">DL</text>

  <!-- Brand name -->
  <text x="152" y="116" font-family="monospace" font-size="20" font-weight="600" fill="#e8e8f0" letter-spacing="2">DAMN LUCK</text>

  <!-- Badge -->
  <rect x="80" y="200" width="240" height="32" rx="16" fill="rgba(0,255,136,0.08)" stroke="rgba(0,255,136,0.2)" stroke-width="1"/>
  <circle cx="104" cy="216" r="5" fill="#00ff88"/>
  <text x="118" y="221" font-family="monospace" font-size="11" fill="#00ff88" letter-spacing="2">LIVE · EARLY ACCESS</text>

  <!-- Headline -->
  <text x="80" y="320" font-family="monospace" font-size="72" font-weight="700" fill="#e8e8f0" letter-spacing="-2">No luck.</text>
  <text x="80" y="410" font-family="monospace" font-size="72" font-weight="700" fill="#00ff88" letter-spacing="-2" filter="url(#textGlow)">Just data.</text>

  <!-- Tagline -->
  <text x="80" y="520" font-family="monospace" font-size="18" fill="#8888a0" letter-spacing="1">Real-time sports market intelligence — No luck required.</text>

  <!-- Right decoration -->
  <rect x="900" y="200" width="8" height="200" rx="4" fill="#00ff88" opacity="0.6"/>
  <rect x="920" y="250" width="8" height="150" rx="4" fill="#00ff88" opacity="0.4"/>
  <rect x="940" y="280" width="8" height="120" rx="4" fill="#00ff88"/>
  <rect x="960" y="230" width="8" height="170" rx="4" fill="#00ff88" opacity="0.3"/>
  <rect x="980" y="260" width="8" height="140" rx="4" fill="#00ff88" opacity="0.5"/>
  <polyline points="900,200 928,250 948,280 968,230 988,260" stroke="#00ff88" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7"/>
</svg>
